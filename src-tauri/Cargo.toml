[package]
name = "metagene-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "metagene_app_lib"
# Metagene ships as a desktop executable. Keeping one Rust-linkable artifact
# prevents examples/all-target gates from racing an un-hashed staticlib/cdylib
# output against Burn's feature-specific dependency graph. Mobile C ABI builds
# are not distributed by this repository.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
metagene-core = { path = "../crates/metagene-core" }
burn = { version = "0.21.0", default-features = false, features = ["std", "flex", "vulkan"] }
flate2 = "1.1.10"
bzip2 = "0.6.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rayon = "1.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
sysinfo = "0.37.2"
tauri = { version = "2.11.5", features = [] }
uuid = { version = "1.26.0", features = ["v4"] }
